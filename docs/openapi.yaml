openapi: 3.1.0
info:
  title: Squabble Room API
  version: 1.0.0
servers:
  - url: https://YOUR-WORKER.workers.dev
paths:
  /health:
    get:
      responses:
        "200": { description: Worker health }
  /api/admin/overview:
    get:
      summary: Admin overview of rooms, finished games, daily counters and rate limits
      description: >
        Requires `Authorization: Bearer <ADMIN_TOKEN>`. Returns 503 when the
        Worker has no ADMIN_TOKEN, 401 for a wrong token, and 429 after ten
        wrong tokens from one network within 10 minutes.
      responses:
        "200": { description: AdminOverview (see protocol.ts) }
        "401": { description: Invalid admin token }
        "429": { description: Too many failed attempts }
        "503": { description: Admin access not configured }
  /api/admin/rooms/{roomCode}:
    parameters:
      - { name: roomCode, in: path, required: true, schema: { type: string } }
    get:
      summary: Room page data (AdminRoomDetail) with seats, moves and board while the room exists
      description: "Requires `Authorization: Bearer <ADMIN_TOKEN>`."
      responses:
        "200": { description: AdminRoomDetail (see protocol.ts) }
        "404": { description: Room not found }
    delete:
      summary: Delete a room, closing its sockets with 4004 and clearing its storage
      description: "Requires `Authorization: Bearer <ADMIN_TOKEN>`. No history is kept for the deleted room."
      responses:
        "200": { description: "{ deleted: roomCode }" }
        "404": { description: Room not found }
  /api/admin/rate-limits/reset:
    post:
      summary: Clear room creation and join rate limits for every network
      description: "Requires `Authorization: Bearer <ADMIN_TOKEN>`."
      responses:
        "200": { description: "{ cleared: number }" }
        "401": { description: Invalid admin token }
  /api/rooms:
    post:
      summary: Create a private temporary room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, settings]
              properties:
                nickname: { type: string, minLength: 1, maxLength: 20 }
                settings:
                  $ref: "#/components/schemas/RoomSettings"
      responses:
        "201": { description: Room, player ID, and private reconnect token }
        "400": { description: Invalid input }
        "429": { description: Creation rate limited }
  /api/rooms/{code}:
    get:
      summary: Whether an invite link can be used right now
      description: >
        Returns RoomStatus. Invite links call this before asking for a nickname
        and poll every 5 seconds while the room is locked or full. Limited to
        300 checks per network per 10 minutes, separate from join attempts.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: "{ joinable, reason: null | locked | full | started, host }",
          }
        "404": { description: "{ joinable: false, reason: missing }" }
        "429": { description: Too many checks }
  /api/rooms/{code}/join:
    post:
      summary: Join an unstarted room
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 1, maxLength: 20 }
      responses:
        "201": { description: Player ID and private reconnect token }
        "404": { description: Room not found or expired }
        "409": { description: Room full, started, or nickname collision }
        "429": { description: Admission rate limited }
  /ws:
    get:
      summary: Authenticated WebSocket upgrade
      description: >-
        The seat token is never placed in the URL. The client offers two
        subprotocols, `squabble.v1` and `token.<seat token>`, in
        Sec-WebSocket-Protocol; the server selects `squabble.v1`. Because
        browsers hide HTTP status codes from WebSocket clients, a refused
        connection is upgraded and immediately closed with code 4004 (room
        expired or deleted) or 4401 (seat token unknown, or the player left).
        Clients retry other closes with exponential backoff.
      parameters:
        - { name: room, in: query, required: true, schema: { type: string } }
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: { type: string, example: "squabble.v1, token.SEAT_TOKEN" }
      responses:
        "101":
          description: WebSocket upgraded, or upgraded and closed with 4004/4401
components:
  schemas:
    RoomSettings:
      type: object
      required: [boardSize, capacity, timerSeconds]
      properties:
        boardSize: { type: integer, minimum: 7, maximum: 40 }
        capacity: { type: integer, enum: [2, 3, 4] }
        timerSeconds: { type: integer, enum: [0, 120, 300] }
# WebSocket messages use protocolVersion 1. Runtime Zod schemas in
# packages/game-engine/src/protocol.ts are authoritative. Every mutating client
# action carries a UUID actionId and expected revision. Public snapshots omit
# bag contents, tokens, and all racks; seat.private is sent only to its token.
# Snapshots include lastMove (words and score of the latest turn), per-player
# left flags, and rematchCode, which room.rematch sets once the game is over.
