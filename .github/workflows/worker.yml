name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/game-engine/**"
      - "package-lock.json"
      - ".github/workflows/worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WORKER_DEPLOY_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    # Read here so steps can check whether the optional TURN key is set.
    env:
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Worker secrets
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
        run: |
          test -n "$RATE_LIMIT_SALT" || { echo "::error::RATE_LIMIT_SALT secret is missing"; exit 1; }
          test ${#ADMIN_TOKEN} -ge 24 || { echo "::error::ADMIN_TOKEN secret is missing or shorter than 24 characters"; exit 1; }
      # Without the optional TURN key, voice chat uses STUN only.
      - name: Deploy Worker
        if: ${{ env.TURN_KEY_ID == '' || env.TURN_KEY_API_TOKEN == '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
          vars: |
            ALLOWED_ORIGINS
            ROOM_CREATE_LIMIT
          secrets: |
            RATE_LIMIT_SALT
            ADMIN_TOKEN
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          # Optional; the Worker falls back to 10 rooms per network per hour.
          ROOM_CREATE_LIMIT: ${{ vars.ROOM_CREATE_LIMIT }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      - name: Deploy Worker with a TURN relay for voice chat
        if: ${{ env.TURN_KEY_ID != '' && env.TURN_KEY_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
          vars: |
            ALLOWED_ORIGINS
            ROOM_CREATE_LIMIT
          secrets: |
            RATE_LIMIT_SALT
            ADMIN_TOKEN
            TURN_KEY_ID
            TURN_KEY_API_TOKEN
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ROOM_CREATE_LIMIT: ${{ vars.ROOM_CREATE_LIMIT }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
